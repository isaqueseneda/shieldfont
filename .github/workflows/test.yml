# On the wording of commit 50311c1, see the message of the commit that added this line.
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Test
        env:
          TMPDIR: /tmp
        run: npm test

      # The screen-reader audit drives real Chromium and asserts on spoken
      # phrases. It is the only check that covers the a11y path end to end,
      # and it was not wired into CI.
      # One combination is enough: it exercises the browser, not the matrix.
      - name: Install Playwright Chromium
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        run: npx playwright install --with-deps chromium

      - name: Accessibility audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          TMPDIR: /tmp
        run: npm run test:a11y

      # The solver races hydration by design, and the unit suite cannot see the
      # outcome: every one of those tests passed identically on the build that
      # threw four #418s at every returning reader. Same browser, so it costs
      # one more minute on the run that already installed Chromium.
      - name: Hydration audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          TMPDIR: /tmp
        run: npm run test:hydration

      # axe-core over both tiers, before AND after the unlock. Added because the
      # docs claimed three of the four tiers "pass WCAG 2.2" while ROADMAP.md
      # said in the same repository that no axe scan had ever been run. It
      # settles the machine-checkable third of WCAG — contrast and accessible
      # names, both of which were guesses — and nothing beyond it. A clean run
      # here is NOT conformance.
      - name: axe scan
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          TMPDIR: /tmp
        run: npm run test:axe

      # The wrapper inside seventeen hostile host pages, measured rather than
      # looked at. axe above scans OUR page, where our stylesheet is the only
      # one; this scans pages that also carry Tailwind Preflight, a `*` reset,
      # `button { all: unset }`, forced-colors, a 10px root and a hand-rolled
      # dark theme — which is where the component actually lives and where the
      # bug that started it ("in dark mode the Uncover button gets all fucked")
      # was invisible to every check we had. Same browser again, so it costs
      # about a minute on the run that already installed Chromium.
      - name: Host-stylesheet audit
        if: matrix.os == 'ubuntu-latest' && matrix.node == '22'
        env:
          TMPDIR: /tmp
        run: npm run test:style

  # ---- REAL NVDA -----------------------------------------------------------
  #
  # Not a simulator. Guidepup installs NVDA and drives it over NVDA's own Remote
  # Access protocol, so what this asserts on is NVDA's speech commands as they
  # happen. Issue #2's central criticism is that this project had only ever been
  # tested with VoiceOver, which is under half of screen reader users; this is
  # the job that stops that being true.
  #
  # windows-latest is free and unmetered on public repositories, and the run
  # takes ~3 minutes.
  #
  # NOT `guidepup/setup-action`. It is pinned to an older @guidepup/setup that
  # records NVDA in the registry, while guidepup 0.29+ stopped reading the
  # registry and looks only in %LOCALAPPDATA%\guidepup — the combination fails
  # with ERR_NVDA_NOT_INSTALLED. Guidepup's own CI calls the CLI directly for
  # this reason; so does this.
  #
  # ORDER MATTERS: `setup install` reads manifest.json out of the INSTALLED
  # @guidepup/guidepup to know which NVDA build to fetch, so it has to run after
  # npm install, and @guidepup/setup has to be pinned to a version whose
  # manifest matches.
  #
  # headless is impossible here and that is not a flag we forgot: a screen
  # reader is a singleton that needs a real interactive desktop (guidepup #83,
  # closed wontfix). continue-on-error while the job earns its trust — a new
  # screen-reader job that goes red on its first flake gets switched off by the
  # third person it inconveniences. Remove it once it has been green for a
  # couple of weeks.
  nvda:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npx -y @guidepup/setup@0.24.1 setup --ci
      - run: npm install
      - run: npm run build
      - run: npx -y @guidepup/setup@0.24.1 install
      - run: npx playwright install chromium
      - run: npm run test:a11y:nvda

  fonts:
    # Gate on the shipped font binaries, not just the TS. A composite whose
    # hmtx left side bearing disagrees with its xMin renders with the last
    # letter of the word shaved off (see CHANGELOG 0.2.1) — invisible to
    # shaping, to advance widths and therefore to every JS test we have.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Check composite metrics on every shipped font
        run: |
          python3 scripts/fix_composite_lsb.py --check \
            packages/font/optik-*.woff2 \
            packages/react/fonts/optik-*.woff2

      # Nothing in CI ever ran a script in scripts/, so reseed_mapping.py sat
      # pointing at a folder that had been renamed out from under it until an
      # outside contributor hit the traceback (#3). A hardcoded path is a
      # string; no test we had could see inside one.
      - name: Smoke-test the scripts
        run: python3 scripts/smoke_test.py
